services:
  server:
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    privileged: true
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: judge0
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - db
      - redis

  worker:
    image: judge0/judge0:1.13.1
    container_name: judge0-worker
    privileged: true
    restart: unless-stopped
    command: ["./scripts/worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: judge0
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    container_name: judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    container_name: judge0-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
